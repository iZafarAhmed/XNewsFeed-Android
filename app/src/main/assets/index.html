<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X News Feed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="app-title">⚡ X News Feed</div>
    <div class="header-actions">
      <button id="refresh-btn" class="hdr-btn" title="Refresh">⟳</button>
      <button id="theme-btn" class="hdr-btn" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="feed">🏠 Feed</div>
    <div class="tab" data-view="trends">🔥 Trending</div>
  </div>

    </div>
    <div id="feed-container"></div>
  </section>

  <!-- TRENDING VIEW -->
  <section id="view-trends" hidden>
    <select id="trend-category-select" class="trend-select" title="Choose a category">
      <option value="news">📰 News</option>
      <option value="world">🌐 World News</option>
      <option value="business">💼 Business</option>
      <option value="science">🔬 Science</option>
      <option value="war">🌍 War News</option>
      <option value="tech">💻 Tech News</option>
      <option value="ai">🤖 AI</option>
      <option value="stocks">💰 India Stocks</option>
      <option value="crypto">🪙 Crypto</option>

    </select>
    <div id="trend-container"></div>
  </section>

  <!-- CHANNEL VIEW -->
  <section id="view-channel" hidden>
    <div class="channel-bar">
      <button id="channel-back-btn" class="hdr-btn" title="Back">←</button>
      <div id="channel-chip" class="channel-chip">@</div>
      <button id="channel-follow-btn" class="btn btn-primary">➕ Follow</button>
    </div>
    <div id="channel-container"></div>
  </section>

  <script src="app.js"></script>

</html>
