<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X News Feed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="app-title">⚡ X News Feed</div>
    <div class="header-actions">
      <button id="refresh-btn" class="hdr-btn" title="Refresh">⟳</button>
      <button id="theme-btn" class="hdr-btn" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="feed">🏠 Feed</div>
    <div class="tab" data-view="trends">🔥 Trending</div>
  </div>

  <!-- FEED VIEW -->
  <section id="view-feed">
    <div class="controls-row">
      <input type="text" id="username-input" placeholder="Enter username" title="Enter any X username">
      <select id="popular-select" class="compact-select" title="Add popular channels">
        <option value="">➕</option>
        <optgroup label="📰 NEWS">
          <option value="BBCBreaking">@BBCBreaking · BBC Breaking</option>
          <option value="Reuters">@Reuters · Reuters</option>
          <option value="AP">@AP · Associated Press</option>
          <option value="CNN">@CNN · CNN</option>
          <option value="AJEnglish">@AJEnglish · Al Jazeera</option>
          <option value="MiddleEastEye">@MiddleEastEye · Middle East Eye</option>
          <option value="nytimes">@nytimes · New York Times</option>
          <option value="guardian">@guardian · The Guardian</option>
          <option value="washingtonpost">@washingtonpost · Washington Post</option>
          <option value="SkyNews">@SkyNews · Sky News</option>
          <option value="NBCNews">@NBCNews · NBC News</option>
          <option value="CBSNews">@CBSNews · CBS News</option>
          <option value="FoxNews">@FoxNews · Fox News</option>
          <option value="Bloomberg">@Bloomberg · Bloomberg</option>
        </optgroup>
        <optgroup label="🤖 AI (Official)">
          <option value="OpenAI">@OpenAI · OpenAI</option>
          <option value="AnthropicAI">@AnthropicAI · Anthropic</option>
          <option value="xAI">@xAI · xAI (Grok)</option>
          <option value="GoogleDeepMind">@GoogleDeepMind · Google DeepMind</option>
          <option value="AIatMeta">@AIatMeta · Meta AI</option>
          <option value="HuggingFace">@HuggingFace · Hugging Face</option>
          <option value="NVIDIA">@NVIDIA · NVIDIA</option>
          <option value="MistralAI">@MistralAI · Mistral AI</option>
          <option value="DeepSeekAI">@DeepSeekAI · DeepSeek</option>
          <option value="StabilityAI">@StabilityAI · Stability AI</option>
        </optgroup>
        <optgroup label="💰 India Stocks">
          <option value="livemint">@livemint · LiveMint</option>
          <option value="EconomicTimes">@EconomicTimes · Economic Times</option>
          <option value="NDTVProfit">@NDTVProfit · NDTV Profit</option>
          <option value="moneycontrolcom">@moneycontrolcom · Moneycontrol</option>
          <option value="ETNOWlive">@ETNOWlive · ET NOW</option>
          <option value="ETmarkets">@ETmarkets · ET Markets</option>
          <option value="CNBCTV18Live">@CNBCTV18Live · CNBC-TV18</option>
          <option value="FinancialXpress">@FinancialXpress · Financial Xpress</option>
        </optgroup>
        <optgroup label="🌍 War News">
          <option value="HormuzLetter">@HormuzLetter · Hormuz Letter</option>
          <option value="araghchi">@araghchi · Abbas Araghchi</option>
          <option value="DaniMayakovski">@DaniMayakovski · Dani Mayakovski</option>
          <option value="drpezeshkian">@drpezeshkian · Masoud Pezeshkian</option>
          <option value="clashreport">@clashreport · Clash Report</option>
          <option value="s_m_marandi">@s_m_marandi · Seyed Mohammad Marandi</option>
          <option value="georgegalloway">@georgegalloway · George Galloway</option>
          <option value="RyanRozbiani">@RyanRozbiani · Ryan Rozbiani</option>
          <option value="DropSiteNews">@DropSiteNews · Drop Site News</option>
          <option value="SuppressedNws1">@SuppressedNws1 · Suppressed News</option>
          <option value="ivan_8848">@ivan_8848 · Ivan</option>
          <option value="GlobalNewsMontr">@GlobalNewsMontr · Global News Montréal</option>
          <option value="RT_com">@RT_com · RT</option>
          <option value="Megatron_ron">@Megatron_ron · Megatron</option>
          <option value="AlternatNews">@AlternatNews · Alternative News</option>
        </optgroup>
        <optgroup label="💻 Tech News">
          <option value="TechCrunch">@TechCrunch · TechCrunch</option>
          <option value="mashable">@mashable · Mashable</option>
          <option value="PCMag">@PCMag · PC Mag</option>
          <option value="CNET">@CNET · CNET</option>
          <option value="engadget">@engadget · Engadget</option>
          <option value="howtogeek">@howtogeek · How-To Geek</option>
          <option value="TechRepublic">@TechRepublic · TechRepublic</option>
          <option value="Gizmodo">@Gizmodo · Gizmodo</option>
          <option value="VentureBeat">@VentureBeat · VentureBeat</option>
          <option value="voxdotcom">@voxdotcom · Vox Tech</option>
          <option value="geekwire">@geekwire · GeekWire</option>
          <option value="arstechnica">@arstechnica · Ars Technica</option>
          <option value="AndroidPolice">@AndroidPolice · Android Police</option>
          <option value="techradar">@techradar · TechRadar</option>
          <option value="siliconrepublic">@siliconrepublic · Silicon Republic</option>
          <option value="DigitalTrends">@DigitalTrends · Digital Trends</option>
          <option value="slashgear">@slashgear · SlashGear</option>
          <option value="slashdot">@slashdot · Slashdot</option>
          <option value="BleepinComputer">@BleepinComputer · Bleeping Computer</option>
          <option value="ZDNET">@ZDNET · ZDNet</option>
          <option value="ExtremeTech">@ExtremeTech · ExtremeTech</option>
          <option value="techdirt">@techdirt · TechDirt</option>
          <option value="xdadevelopers">@xdadevelopers · XDA</option>
          <option value="BGR">@BGR · BGR</option>
          <option value="nypost">@nypost · NYPost Tech</option>
          <option value="TechPowerUp">@TechPowerUp · TechPowerUp</option>
          <option value="tomshardware">@tomshardware · Tom's Hardware</option>
          <option value="petapixel">@petapixel · PetaPixel</option>
          <option value="nbc_en">@nbc_en · Notebookcheck</option>
          <option value="technology">@technology · Bloomberg Tech</option>
          <option value="washingtonpost">@washingtonpost · WA Post Tech</option>
          <option value="gizchina">@gizchina · GizChina</option>
          <option value="RedSharkNews">@RedSharkNews · RedShark News</option>
          <option value="HotHardware">@HotHardware · HotHardware</option>
          <option value="Gadgets360">@Gadgets360 · Gadgets 360</option>
          <option value="SiliconANGLE">@SiliconANGLE · Silicon Angle</option>
          <option value="eetimes">@eetimes · EE Times</option>
        </optgroup>
      </select>
      <button id="load-btn" class="btn btn-primary">Add</button>
      <button id="clear-btn" class="btn btn-icon" title="Clear all saved feeds">🗑</button>
    </div>
    <div id="feed-container"></div>
  </section>

  <!-- TRENDING VIEW -->
  <section id="view-trends" hidden>
    <select id="trend-category-select" class="trend-select" title="Choose a category">
      <option value="news">📰 News</option>
      <option value="ai">🤖 AI</option>
      <option value="stocks">💰 India Stocks</option>
      <option value="war">🌍 War News</option>
      <option value="tech">💻 Tech News</option>
    </select>
    <div id="trend-container"></div>
  </section>

  <!-- CHANNEL VIEW (tap any username) -->
  <section id="view-channel" hidden>
    <div class="channel-bar">
      <button id="channel-back-btn" class="hdr-btn" title="Back">←</button>
      <div id="channel-chip" class="channel-chip">@</div>
      <button id="channel-follow-btn" class="btn btn-primary">➕ Follow</button>
    </div>
    <div id="channel-container"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
